services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aetherdust
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: aetherdust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherdust"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://aetherdust:changeme@postgres:5432/aetherdust
      JWT_SECRET: super-secret-change-me-in-production
      CORS_ORIGINS: "http://localhost:5173"
      RATE_LIMIT_RPS: "10"
      RATE_LIMIT_WINDOW_MS: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
